<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h2>♥ HeartCare</h2>
    <a href="/" style="color:white;text-decoration:none;">
        New Prediction
    </a>
</header>

<section class="container">

    <div class="card" style="text-align:center; margin-top:80px;">

        <h2>Prediction Result</h2>

        <div style="
            margin:30px 0;
            padding:25px;
            border:2px dashed #c62848;
            border-radius:12px;
            font-size:22px;
            color:#8e1830;
            font-weight:bold;
        ">

            {{ result }}

        </div>

        <p style="color:#777;">
            This result is generated by a machine learning model
            and should not be considered a medical diagnosis.
        </p>

        <br>

        <a href="/" style="
            display:inline-block;
            padding:12px 25px;
            background:#8e1830;
            color:white;
            text-decoration:none;
            border-radius:8px;
        ">
            Back to Prediction
        </a>

    </div>

</section>

</body>
</html>
